<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 2000, H = 1500;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;

const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 60);
camera.position.set(0.45, 1.45, 8.2); camera.lookAt(0.45, 0.98, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd5dbe2, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(-1.2, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 8; sun.shadow.bias = -0.0003;
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 25 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(4, 2, 6); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const alu = new THREE.MeshPhysicalMaterial({ color: 0xd4d9df, metalness: 0.9, roughness: 0.28, envMapIntensity: 1.4 });

// ---------- células mono half-cut: escuras com grade prateada fina ----------
function cellTexture() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 2420;
  const g = c.getContext('2d');
  g.fillStyle = '#c3cad3'; g.fillRect(0, 0, c.width, c.height);
  const cols = 6, rows = 24, m = 14, gap = 5, mid = 22;
  const cw = (c.width - 2 * m - (cols - 1) * gap) / cols;
  const ch = (c.height - 2 * m - (rows - 1) * gap - mid) / rows;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const x = m + k * (cw + gap), y = m + r * (ch + gap) + (r >= rows / 2 ? mid : 0);
    const grd = g.createLinearGradient(x, y, x + cw * 0.6, y + ch);
    grd.addColorStop(0, '#1a2134'); grd.addColorStop(1, '#141a2a');
    g.fillStyle = grd; g.fillRect(x, y, cw, ch);
    g.fillStyle = 'rgba(150,165,190,.22)';
    for (let b = 1; b <= 9; b++) g.fillRect(x + (cw * b) / 10 - 1, y, 1.5, ch);
    g.fillStyle = 'rgba(120,135,160,.10)';
    for (let f = 3; f < ch; f += 5) g.fillRect(x, y + f, cw, 1);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t;
}
const cellTex = cellTexture();

function panel() {
  const grp = new THREE.Group();
  const w = 1.13, h = 2.28, d = 0.035, f = 0.02;
  [[w, f, 0, h / 2 - f / 2], [w, f, 0, -h / 2 + f / 2], [f, h, -w / 2 + f / 2, 0], [f, h, w / 2 - f / 2, 0]]
    .forEach(([bw, bh, x, y]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, d), alu); m.position.set(x, y, 0); m.castShadow = true; grp.add(m); });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w - 2 * f, h - 2 * f),
    new THREE.MeshPhysicalMaterial({ map: cellTex, roughness: 0.25, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 0.9 }));
  face.position.z = d / 2 - 0.006; grp.add(face);
  const back = new THREE.Mesh(new THREE.BoxGeometry(w - 2 * f, h - 2 * f, 0.004), new THREE.MeshStandardMaterial({ color: 0xeef0f2, roughness: 0.8 }));
  back.position.z = -d / 2 + 0.004; back.castShadow = true; grp.add(back);
  return grp;
}

// ---------- inversor de parede (tampa branca, carcaça escura, faixa de display) ----------
function inverter() {
  const grp = new THREE.Group();
  const w = 0.62, h = 0.66, d = 0.2;
  const housing = new THREE.Mesh(new RoundedBoxGeometry(w - 0.02, h - 0.03, d, 4, 0.02), new THREE.MeshStandardMaterial({ color: 0x23272d, roughness: 0.55 }));
  housing.position.z = -0.01; housing.castShadow = true; grp.add(housing);
  const cover = new THREE.Mesh(new RoundedBoxGeometry(w, h, 0.06, 6, 0.025),
    new THREE.MeshPhysicalMaterial({ color: 0xf6f7f8, roughness: 0.32, clearcoat: 0.8, clearcoatRoughness: 0.2 }));
  cover.position.z = d / 2 + 0.01; cover.castShadow = true; grp.add(cover);
  const fz = d / 2 + 0.041;
  // parafusos
  const screwMat = new THREE.MeshPhysicalMaterial({ color: 0xb8bec6, metalness: 1, roughness: 0.3 });
  [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sy]) => {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.004, 20), screwMat);
    s.rotation.x = Math.PI / 2; s.position.set(sx * (w / 2 - 0.03), sy * (h / 2 - 0.03), fz); grp.add(s);
  });
  // faixa preta do display
  const bandMat = new THREE.MeshPhysicalMaterial({ color: 0x0b0d10, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05 });
  const bandFrame = new THREE.Mesh(new THREE.BoxGeometry(0.535, 0.125, 0.004), new THREE.MeshStandardMaterial({ color: 0xc9ced4, metalness: 0.6, roughness: 0.3 }));
  bandFrame.position.set(0, -0.09, fz); grp.add(bandFrame);
  const band = new THREE.Mesh(new THREE.BoxGeometry(0.525, 0.115, 0.006), bandMat);
  band.position.set(0, -0.09, fz + 0.001); grp.add(band);
  const lcd = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.03), new THREE.MeshBasicMaterial({ color: 0x8fb8e8 }));
  lcd.position.set(0.02, -0.065, fz + 0.0045); grp.add(lcd);
  [[-0.005, 0x6b7280, 0.006], [0.03, 0x6b7280, 0.006], [0.06, 0x22c55e, 0.004]].forEach(([x, col, r]) => {
    const b = new THREE.Mesh(new THREE.CircleGeometry(r, 24), new THREE.MeshBasicMaterial({ color: col }));
    b.position.set(x, -0.112, fz + 0.0045); grp.add(b);
  });
  // conectores embaixo
  const conMat = new THREE.MeshStandardMaterial({ color: 0x15181c, roughness: 0.5 });
  [-0.24, -0.205, -0.17, -0.135, -0.03, 0.0, 0.2].forEach((x, i) => {
    const r = i === 6 ? 0.018 : i > 3 ? 0.014 : 0.011;
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.045, 20), conMat);
    c.position.set(x, -h / 2 - 0.02, 0.02); c.castShadow = true; grp.add(c);
  });
  const ac = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.035, 0.05), conMat); ac.position.set(-0.09, -h / 2 - 0.015, 0.02); grp.add(ac);
  // suporte de parede
  const br = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.56, 0.015), new THREE.MeshPhysicalMaterial({ color: 0xa9b0b8, metalness: 0.85, roughness: 0.35 }));
  br.position.set(0, 0, -d / 2 - 0.02); br.castShadow = true; grp.add(br);
  return grp;
}

// ---------- rolo de cabo solar ----------
function cableRoll(color, rIn = 0.1, rOut = 0.22, height = 0.11) {
  const grp = new THREE.Group();
  const tube = 0.0085;
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.3 });
  for (let y = tube; y < height; y += tube * 1.9)
    for (let r = rIn; r <= rOut; r += tube * 1.95) {
      const t = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, 90), mat);
      t.rotation.x = Math.PI / 2; t.position.y = y; t.castShadow = true; grp.add(t);
    }
  const tieMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.5 });
  [0, Math.PI].forEach((a) => {
    const tie = new THREE.Mesh(new THREE.BoxGeometry(rOut - rIn + 0.03, height + 0.006, 0.008), tieMat);
    tie.position.set(Math.cos(a) * (rIn + rOut) / 2, height / 2, Math.sin(a) * (rIn + rOut) / 2);
    tie.rotation.y = -a; grp.add(tie);
  });
  return grp;
}

// ---------- string box (quadro de proteção com tampa translúcida) ----------
function stringBox() {
  const grp = new THREE.Group();
  const w = 0.3, h = 0.44, d = 0.14;
  const body = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, 0.02), new THREE.MeshPhysicalMaterial({ color: 0xe4e7ea, roughness: 0.45 }));
  body.castShadow = true; grp.add(body);
  const inner = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.05, h - 0.06), new THREE.MeshStandardMaterial({ color: 0xcfd4d9, roughness: 0.7 }));
  inner.position.z = d / 2 + 0.001; grp.add(inner);
  const brk = new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.5 });
  const red = new THREE.MeshStandardMaterial({ color: 0xc81e1e, roughness: 0.5 });
  [0.12, 0, -0.12].forEach((y) => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(w - 0.06, 0.012, 0.01), alu); rail.position.set(0, y - 0.03, d / 2 + 0.006); grp.add(rail);
    for (let i = 0; i < 4; i++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.06, 0.03), brk); b.position.set(-0.04 + i * 0.037, y, d / 2 + 0.016); grp.add(b);
      const l = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.02, 0.01), red); l.position.set(-0.04 + i * 0.037, y + 0.008, d / 2 + 0.034); grp.add(l);
    }
  });
  const door = new THREE.Mesh(new RoundedBoxGeometry(w + 0.01, h + 0.01, 0.02, 4, 0.012),
    new THREE.MeshPhysicalMaterial({ color: 0x9aa3ad, roughness: 0.1, transmission: 0.0, transparent: true, opacity: 0.32, clearcoat: 1 }));
  door.position.z = d / 2 + 0.06; grp.add(door);
  const hinge = new THREE.Mesh(new THREE.BoxGeometry(0.02, h, 0.05), new THREE.MeshStandardMaterial({ color: 0xd9dde1, roughness: 0.5 }));
  hinge.position.set(-w / 2 - 0.005, 0, d / 2 + 0.035); grp.add(hinge);
  return grp;
}

// ---------- grampos (mid/end clamp) e perfil ----------
function clamp() {
  const grp = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.012, 0.045), alu); top.position.y = 0.05; grp.add(top);
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.05, 0.045), alu); legL.position.set(-0.026, 0.025, 0); grp.add(legL);
  const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.09, 12), alu); bolt.position.y = 0.02; grp.add(bolt);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.008, 6), alu); head.position.y = 0.06; grp.add(head);
  grp.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return grp;
}

// ---------- composição (inspirada em foto de catálogo, desenho original) ----------
const p2 = panel(); p2.position.set(1.68, 1.22, -0.75); p2.rotation.y = -0.1; scene.add(p2);
const p1 = panel(); p1.position.set(0.98, 1.16, -0.3); p1.rotation.y = -0.1; scene.add(p1);

const inv = inverter(); inv.scale.setScalar(2.0); inv.position.set(-0.3, 0.95, 0.55); inv.rotation.y = 0.42; scene.add(inv);

const blackRoll = cableRoll(0x1a1c20); blackRoll.position.set(0.42, 0, 1.3); scene.add(blackRoll);
const redRoll = cableRoll(0xb3171b); redRoll.position.set(0.42, 0.112, 1.3); scene.add(redRoll);

const sb = stringBox(); sb.scale.setScalar(1.35); sb.position.set(1.1, 0.31, 0.95); sb.rotation.y = -0.3; scene.add(sb);

const rail = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.04, 0.04), alu); rail.position.set(0.9, 0.02, 1.45); rail.rotation.y = 0.5; rail.castShadow = true; scene.add(rail);

[[-0.05, 1.62, 0.2], [0.06, 1.55, -0.3], [0.18, 1.68, 0.4], [0.62, 1.62, 0.1], [0.74, 1.7, -0.2], [-0.15, 1.72, 0.6]].forEach(([x, z, ry]) => {
  const c = clamp(); c.scale.setScalar(1.2); c.position.set(x, 0, z); c.rotation.y = ry; scene.add(c);
});

renderer.render(scene, camera);
window.__png = renderer.domElement.toDataURL('image/png');
window.__done = true;
</script>
</body></html>
